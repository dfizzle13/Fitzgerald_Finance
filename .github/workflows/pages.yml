name: Validate Fitzgerald Finance (no deployment)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate inline JavaScript and manifest
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = html.split('<script>').slice(1).map(part => part.split('</script>')[0]);
          if (!scripts.length) throw new Error('No inline scripts found');
          scripts.forEach((script) => new Function(script));
          JSON.parse(fs.readFileSync('manifest.webmanifest', 'utf8'));
          console.log('Validated ' + scripts.length + ' inline scripts and manifest JSON.');
          NODE
      - name: Set up Python for the household server checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install device authentication dependencies
        run: python -m pip install -r Server/requirements.txt
      - name: Check budgeting and shared synchronization
        run: |
          node tests/bills.test.cjs
          node tests/shared-client.test.cjs
          node tests/device-client.test.cjs
          python -m unittest discover -s tests -p 'test_*.py'

  android-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile Android source without packaging an APK
        run: gradle --no-daemon :app:compileReleaseJavaWithJavac
