name: Validate Fitzgerald Finance (no deployment)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate inline JavaScript and manifest
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = html.split('<script>').slice(1).map(part => part.split('</script>')[0]);
          if (!scripts.length) throw new Error('No inline scripts found');
          scripts.forEach((script) => new Function(script));
          JSON.parse(fs.readFileSync('manifest.webmanifest', 'utf8'));
          console.log('Validated ' + scripts.length + ' inline scripts and manifest JSON.');
          NODE
