name: Build Fitzgerald Finance APK

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "signing/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Record APK rebuild request
        run: echo "Rebuilding Fitzgerald Finance APK from the current main branch."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify application ID and stable signing key
        run: |
          grep -q 'applicationId "com.fitzgerald.finance.next"' app/build.gradle
          test -s signing/debug.keystore.b64
          mkdir -p signing
          base64 --decode signing/debug.keystore.b64 > signing/debug.keystore
          keytool -list -keystore signing/debug.keystore -storepass android -alias androiddebugkey

      - name: Build installable release APK
        run: |
          gradle --no-daemon :app:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Fitzgerald-Finance.apk
          test -s dist/Fitzgerald-Finance.apk

      - name: Verify APK package, version, and signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Fitzgerald-Finance.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Fitzgerald-Finance.apk | grep -F "package: name='com.fitzgerald.finance.next'"
          keytool -printcert -jarfile dist/Fitzgerald-Finance.apk | grep -F 'D4:7E:1F:02:94:EF:DC:18:4B:48:BE:E9:9B:12:42:07:37:32:4C:DE:A8:79:96:40:DD:B7:61:DB:86:6A:D1:55'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fitzgerald-Finance-APK
          path: dist/Fitzgerald-Finance.apk
          if-no-files-found: error
          retention-days: 30
