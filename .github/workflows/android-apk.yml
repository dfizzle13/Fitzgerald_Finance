name: Build Fitzgerald Finance APK
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: |
          gradle --no-daemon :app:assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Fitzgerald-Finance.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fitzgerald-Finance-APK
          path: dist/Fitzgerald-Finance.apk
          if-no-files-found: error
          retention-days: 30
