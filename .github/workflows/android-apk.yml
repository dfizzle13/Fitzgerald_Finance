name: Build Fitzgerald Finance APK
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify application ID
        run: grep -q 'applicationId "com.fitzgerald.finance"' app/build.gradle
      - name: Require persistent signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "::error::Missing repository secret ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "::error::Missing repository secret ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "::error::Missing repository secret ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "::error::Missing repository secret ANDROID_KEY_PASSWORD" && exit 1)
      - name: Build APK
        run: |
          gradle --no-daemon -PAPP_VERSION_CODE=${GITHUB_RUN_NUMBER} :app:assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Fitzgerald-Finance-unsigned.apk
          test -s dist/Fitzgerald-Finance-unsigned.apk
      - name: Sign APK with persistent key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fitzgerald-finance.jks"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/fitzgerald-finance.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out dist/Fitzgerald-Finance.apk \
            dist/Fitzgerald-Finance-unsigned.apk
          rm -f "$RUNNER_TEMP/fitzgerald-finance.jks" dist/Fitzgerald-Finance-unsigned.apk
      - name: Verify APK package and signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Fitzgerald-Finance.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Fitzgerald-Finance.apk | grep -F "package: name='com.fitzgerald.finance'"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fitzgerald-Finance-APK
          path: dist/Fitzgerald-Finance.apk
          if-no-files-found: error
          retention-days: 30
