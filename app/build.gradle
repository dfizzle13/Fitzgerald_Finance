plugins {
    id "com.android.application"
}

android {
    namespace "com.fitzgerald.finance"
    compileSdk 35

    defaultConfig {
        applicationId "com.fitzgerald.finance"
        minSdk 23
        targetSdk 35
        versionCode (project.findProperty("APP_VERSION_CODE") ?: "1").toInteger()
        versionName "1.0." + (project.findProperty("APP_VERSION_CODE") ?: "1")
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.core:core:1.13.1"
}

configurations.configureEach {
    // Kotlin 1.8+ folds these JDK-specific classes into kotlin-stdlib.
    // Older AndroidX transitive dependencies may still request duplicate legacy jars.
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
}
