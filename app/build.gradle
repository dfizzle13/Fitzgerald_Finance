plugins {
    id "com.android.application"
}

def appBuildNumber = System.getenv("GITHUB_RUN_NUMBER") ?: "1"

android {
    namespace "com.fitzgerald.finance"
    compileSdk 35

    defaultConfig {
        // A one-time package identity reset avoids signature conflicts with prior
        // APKs signed by temporary CI debug keys. Future APKs keep this ID.
        applicationId "com.fitzgerald.finance.next"
        minSdk 23
        targetSdk 35
        versionCode appBuildNumber.toInteger()
        versionName "1.0.${appBuildNumber}"
    }

    signingConfigs {
        stableDebug {
            storeFile file("${rootProject.projectDir}/signing/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            versionNameSuffix "-debug"
        }
        release {
            signingConfig signingConfigs.stableDebug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.core:core:1.13.1"
}

configurations.configureEach {
    // Kotlin 1.8+ folds these JDK-specific classes into kotlin-stdlib.
    // Older AndroidX transitive dependencies may still request duplicate legacy jars.
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
}
